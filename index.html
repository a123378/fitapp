<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>我的健身</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">我的健身</h1>
    <div class="row">
      <span id="sync-badge" class="badge">本機</span>
      <button id="open-settings" class="icon-btn" aria-label="設定">⚙️</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-route="home" class="tab active"><span class="tab-ic">🏠</span>首頁</button>
    <button data-route="body" class="tab"><span class="tab-ic">⚖️</span>體重</button>
    <button data-route="stats" class="tab"><span class="tab-ic">📈</span>表現</button>
  </nav>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-sheet">
      <div class="modal-head"><h2>設定</h2><button id="close-settings" class="icon-btn" aria-label="關閉">✕</button></div>
      <div id="settings-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then((r) => r.update()));
      // 新版接手後自動重新整理一次，才會看到最新畫面
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
    }
  </script>
</body>
</html>
